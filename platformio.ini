; Odczyt licznika energii (HAN wireless M-Bus T1, 868.95 MHz) - ESP8266 NodeMCU V3 + CC1101
[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp8266_exception_decoder

; Wgrywanie przez Wi-Fi: python -m platformio run -e ota -t upload
; --auth = haslo administratora (domyslnie z config.h; po zmianie na stronie zmien tez tutaj)
[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
; adres IP ESP (Python na Windows nie rozpoznaje nazw .local) - najlepiej zarezerwuj go w routerze (DHCP)
upload_port = 192.168.31.89
upload_flags = --auth=licznik

; Firmware dla znajomego (inna siec Wi-Fi): python -m platformio run -e znajomy
; plik wynikowy: .pio/build/znajomy/firmware.bin (wgrywac od adresu 0x0)
[env:znajomy]
extends = env:nodemcuv2
build_flags = -D WIFI_SSID=\"Reksio\" -D WIFI_PASSWORD=\"Michal1982\"
